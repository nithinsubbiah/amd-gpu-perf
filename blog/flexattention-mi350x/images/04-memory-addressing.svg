   <g id="text_1">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172333" x="28.8" y="37.584844" transform="rotate(-0 28.8 37.584844)">Streamlining memory addressing</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526173" x="28.8" y="63.730937" transform="rotate(-0 28.8 63.730937)">Known bounds let the compiler retain one base address and use smaller offsets.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17608a" x="194.4" y="116.224531" transform="rotate(-0 194.4 116.224531)">Storage provably &lt; 2 GiB</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17608a" x="576" y="116.054531" transform="rotate(-0 576 116.054531)">tt.pointer_range = 32</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17608a" x="957.6" y="116.290938" transform="rotate(-0 957.6 116.290938)">Separate base and offsets</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172333" x="50.4" y="198.754687" transform="rotate(-0 50.4 198.754687)">General address representation</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17608a" x="612" y="198.754687" transform="rotate(-0 612 198.754687)">Base plus bounded offsets</text>
   </g>
   <g id="text_8">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526173" x="51.84" y="261.192188" transform="rotate(-0 51.84 261.192188)">lane 0</text>
   </g>
   <g id="text_9">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172333" x="313.2" y="261.937813" transform="rotate(-0 313.2 261.937813)">64-bit address = base + offset0</text>
   </g>
   <g id="text_10">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526173" x="51.84" y="307.992188" transform="rotate(-0 51.84 307.992188)">lane 1</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172333" x="313.2" y="308.737812" transform="rotate(-0 313.2 308.737812)">64-bit address = base + offset1</text>
   </g>
   <g id="text_12">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526173" x="51.84" y="354.792187" transform="rotate(-0 51.84 354.792187)">lane 2</text>
   </g>
   <g id="text_13">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172333" x="313.2" y="355.537812" transform="rotate(-0 313.2 355.537812)">64-bit address = base + offset2</text>
   </g>
   <g id="text_14">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526173" x="51.84" y="401.592188" transform="rotate(-0 51.84 401.592188)">lane 3</text>
   </g>
   <g id="text_15">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172333" x="313.2" y="402.337812" transform="rotate(-0 313.2 402.337812)">64-bit address = base + offset3</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17608a" x="871.2" y="248.630625" transform="rotate(-0 871.2 248.630625)">Shared 64-bit base</text>
   </g>
   <g id="text_17">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172333" x="903.6" y="303.325" transform="rotate(-0 903.6 303.325)">lane 0: bounded 32-bit offset0</text>
   </g>
   <g id="text_18">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172333" x="903.6" y="342.925" transform="rotate(-0 903.6 342.925)">lane 1: bounded 32-bit offset1</text>
   </g>
   <g id="text_19">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172333" x="903.6" y="382.525" transform="rotate(-0 903.6 382.525)">lane 2: bounded 32-bit offset2</text>
   </g>
   <g id="text_20">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172333" x="903.6" y="422.125" transform="rotate(-0 903.6 422.125)">lane 3: bounded 32-bit offset3</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526173" x="295.2" y="487.296562" transform="rotate(-0 295.2 487.296562)">General global loads and stores</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17608a" x="856.8" y="487.296562" transform="rotate(-0 856.8 487.296562)">Eligible buffer loads and stores</text>
   </g>
   <g id="text_23">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526173" x="28.8" y="549.455" transform="rotate(-0 28.8 549.455)">Addresses remain 64-bit. The compiler narrows offsets only when it can prove the transformation safe.</text>
   </g>
   <g id="text_24">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526173" x="28.8" y="572.939062" transform="rotate(-0 28.8 572.939062)">This diagram covers loads and stores; atomic-containing kernels need the separate annotation guard.</text>
   </g>
  </g>
